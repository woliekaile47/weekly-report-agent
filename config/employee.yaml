name: 经营周报员工
skill: skills/weekly-report/SKILL.md
allowed_tools: [search_news, read_sales, read_minutes, compute_metrics, generate_report, inspect_report]
limits:
  model_calls: 8
  model_input_characters: 160000
  model_timeout_seconds: 90
  active_seconds: 600
  tool_timeout_seconds: 90
  tool_retries: 2
  quality_repairs: 2
limit_reasons:
  model_calls: 为初稿、有限质检修正及故障重试共用请求额度；每个实际请求含失败均计数，超限暂停转人工。
  model_input_characters: 限制发送给模型的系统指令与业务内容总字符量；超限暂停补充或整理材料，不把字符数误称为精确 token 数。
  model_timeout_seconds: 为模型结构化分析预留完成时间；超时暂停转人工，避免无限等待。
  active_seconds: 覆盖数据处理与有限模型修正；超过上限保存进度并要求人工处理，等待人工不计时。
quality:
  min_characters: 160
  max_characters: 1800
  max_pages: 3
  min_charts: 2
  required_sections: [本周摘要, 核心指标, 品类与单品, 异常与原因, 数据质量说明, 下周关注事项]
  forbidden_words: [保证盈利, 内部绝密]
  max_actions: 5
  max_summary_sentences: 5
  min_summary_characters: 30
  min_reason_characters: 8
  min_action_characters: 12
business:
  flat_phrases: [基本持平, 整体持平]
  flat_tolerance_percent: 3
  anomaly_percent: 10
  margin_drop_points: 5
  duplicate_key: record_id
  duplicate_policy: identical_only
  delivery_requires_human: true
rework:
  # 这些业务路由与影响章节可由团队修改；节点及章节取值由程序限制。
  categories:
    data:
      keywords: [销售材料, 销售文件, 统计口径, 周期错误, 字段映射, 重新计算]
      sections: [summary, anomalies, conflicts, data_notes, actions]
    evidence:
      keywords: [纪要, 证据, 原因, 引用, 停业, 缺数, 冲突]
      sections: [anomalies, conflicts, data_notes, actions]
    content:
      keywords: [文字, 摘要, 表述, 内容, 建议, 行动]
      sections: [summary, anomalies, conflicts, data_notes, actions]
    layout:
      keywords: [页数, 图表, 排版, 字体, 表格]
      sections: []
  section_keywords:
    summary: [摘要]
    anomalies: [异常, 原因]
    conflicts: [冲突, 持平]
    data_notes: [数据质量, 停业, 缺数, 退货, 重复]
    actions: [建议, 行动, 核实步骤]
  quality_routes:
    结构完整: {category: layout, sections: []}
    正文长度: {category: content, sections: [summary, anomalies, conflicts, data_notes, actions]}
    摘要句数: {category: content, sections: [summary]}
    章节内容有效: {category: content, sections: [summary, anomalies, conflicts, data_notes, actions]}
    指标引用: {category: content, sections: [summary, anomalies, conflicts, data_notes, actions]}
    指标语义一致: {category: content, sections: [summary, anomalies, conflicts, data_notes, actions]}
    正文数字依据: {category: content, sections: [summary, anomalies, conflicts, data_notes, actions]}
    异常逐项覆盖: {category: evidence, sections: [anomalies]}
    证据原文可追溯: {category: evidence, sections: [anomalies, conflicts, data_notes, actions]}
    图表完整: {category: layout, sections: []}
    行动项与反馈: {category: content, sections: [actions]}
    纪要与数据冲突提示: {category: evidence, sections: [conflicts]}
    敏感用语: {category: content, sections: [summary, anomalies, conflicts, data_notes, actions]}
    表格数值一致: {category: layout, sections: []}
    文件完整: {category: layout, sections: []}
    Word实际页数: {category: layout, sections: []}
  compact_layout:
    font_points: 8
    space_after_points: 2
    line_spacing: 1
