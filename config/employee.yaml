name: 经营周报员工
skill: skills/weekly-report/SKILL.md
allowed_tools: [read_sales, read_minutes, compute_metrics, generate_report, inspect_report]
limits:
  model_calls: 8
  model_timeout_seconds: 90
  active_seconds: 600
  tool_timeout_seconds: 90
  tool_retries: 2
  quality_repairs: 2
limit_reasons:
  model_calls: 初稿、两轮质检修正及故障重试共用八次请求额度，限制免费模型消耗；每个实际请求含失败均计数。
  model_timeout_seconds: 允许免费模型在九十秒内完成结构化分析，达到上限暂停转人工，避免无限等待。
  active_seconds: 十分钟覆盖约十万行以内的数据处理与有限模型修正，超过上限保存进度并要求人工处理。
quality:
  min_characters: 160
  max_characters: 1800
  max_pages: 3
  min_charts: 2
  required_sections: [本周摘要, 核心指标, 品类与单品, 异常与原因, 数据质量说明, 下周关注事项]
  forbidden_words: [保证盈利, 内部绝密]
  max_actions: 5
business:
  flat_phrases: [基本持平, 整体持平]
  flat_tolerance_percent: 3
  anomaly_percent: 10
  margin_drop_points: 5
  duplicate_key: record_id
  duplicate_policy: identical_only
  delivery_requires_human: true
