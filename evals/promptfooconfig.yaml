description: 企业公开输入的工程路径回归（真实LangGraph/MCP，模型为测试替身，非业务验收结论）
prompts: ['{{scenario}}']
providers:
  - id: file://provider.py
    label: engineering-workflow
defaultTest:
  assert:
    - type: is-json
tests:
  - description: A-01 第44周指标、三页两图及审核关口
    vars: {scenario: A-01}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.status==="awaiting_human" && x.total.cents===57363487 && x.total.change===-9.3 && x.total.margin===61.1 && x.quality_passed && x.pages<=3; })()'
  - description: A-02 第43周按ID剔除重复上传
    vars: {scenario: A-02}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.status==="awaiting_human" && x.total.cents===63248576 && x.data_quality.removed_count===29 && x.data_quality.removed_cents===562941; })()'
  - description: A-03 缺销售暂停后同任务补齐
    vars: {scenario: A-03}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.initial_status==="paused" && x.status==="awaiting_human"; })()'
  - description: A-04 第42周退货冲减与数据覆盖
    vars: {scenario: A-04}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.status==="awaiting_human" && x.total.cents===60590899 && x.data_quality.return_count===15 && x.data_quality.return_cents===-65600; })()'
  - description: A-05 超出数据范围不调用模型编造
    vars: {scenario: A-05}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.status==="paused" && x.reason.includes("2026-11-01") && !x.total; })()'
  - description: 工具故障三次后暂停
    vars: {scenario: tool_failure}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.status==="paused" && x.tool_failures===3; })()'
