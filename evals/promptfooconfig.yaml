description: 企业公开输入的工程路径回归（真实LangGraph/MCP，模型为测试替身，非业务验收结论）
prompts: ['{{scenario}}']
providers:
  - id: file://provider.py
    label: engineering-workflow
defaultTest:
  assert:
    - type: is-json
tests:
  - description: A-01 第44周指标、三页两图及审核关口
    vars: {scenario: A-01}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.status==="awaiting_human" && x.total.cents===57363487 && x.total.change===-9.3 && x.total.margin===61.1 && x.quality_passed && x.pages<=3; })()'
  - description: A-02 第43周按ID剔除重复上传
    vars: {scenario: A-02}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.status==="awaiting_human" && x.total.cents===63248576 && x.data_quality.removed_count===29 && x.data_quality.removed_cents===562941; })()'
  - description: A-03 缺销售暂停后同任务补齐
    vars: {scenario: A-03}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.initial_status==="paused" && x.status==="awaiting_human"; })()'
  - description: A-04 第42周退货冲减与数据覆盖
    vars: {scenario: A-04}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.status==="awaiting_human" && x.total.cents===60590899 && x.data_quality.return_count===15 && x.data_quality.return_cents===-65600; })()'
  - description: A-05 超出数据范围不调用模型编造
    vars: {scenario: A-05}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.status==="paused" && x.reason.includes("2026-11-01") && !x.total; })()'
  - description: 纪要周期冲突在模型分析前暂停
    vars: {scenario: minutes_period_mismatch}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.status==="paused" && x.reason.includes("纪要") && x.model_calls===0; })()'
  - description: 工具故障三次后暂停
    vars: {scenario: tool_failure}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.status==="paused" && x.tool_failures===3; })()'
  - description: 版式退回直接重生成且不调用模型
    vars: {scenario: layout_rework}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.status==="awaiting_human" && x.rework_model_calls===0 && x.revision_items.length===1 && x.revision_items[0].status==="verified"; })()'
  - description: 两条审核意见均有回应与实际内容修改
    vars: {scenario: review_items}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.status==="awaiting_human" && x.revision_items.length===2 && x.revision_items.every(i=>i.status==="verified"); })()'
  - description: MCP首次连接故障有限重试并可跨服务实例恢复
    vars: {scenario: mcp_connection}
    assert:
      - type: javascript
        value: '(() => { const x=JSON.parse(output); return x.initial_status==="paused" && x.connection_failures===3 && x.status==="awaiting_human"; })()'
