[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-report-employee"
version = "0.1.0"
description = "可审核、可恢复的经营周报员工"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "mcp>=1.20,<2",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "matplotlib>=3.9,<4",
  "streamlit>=1.45,<2",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
weekly-report = "weekly_report.cli:main"

[tool.setuptools.packages.find]
include = ["weekly_report*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
