[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-report-agent"
version = "2.0.0"
description = "基于开源工作流组件的可审核经营周报员工"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "mcp>=1.20,<2", "pydantic>=2.10,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2", "PyYAML>=6,<7", "pandas>=2.2,<4", "openpyxl>=3.1,<4", "python-docx>=1.1,<2", "docxtpl>=0.20,<1", "matplotlib>=3.9,<4", "filelock>=3.16,<4", "pywin32>=308; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2", "pymupdf>=1.25,<2", "reportlab>=4,<6"]

[tool.setuptools.packages.find]
include = ["report_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
